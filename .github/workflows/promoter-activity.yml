name: Promoter Activity Scanner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sharesanket-promoter-activity
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: promoter/requirements-promoter.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r promoter/requirements-promoter.txt

      - name: Scan NSE promoter disclosures
        run: python promoter/promoter_scanner.py

      - name: Save and publish alerts
        id: save
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add alerts.json promoter/promoter_state.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Share Sanket promoter activity alerts"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "site_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.save.outputs.site_changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.save.outputs.site_changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        if: steps.save.outputs.site_changed == 'true'
        uses: actions/deploy-pages@v4
