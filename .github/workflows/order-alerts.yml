name: Order Alerts Scan

on:
  push:
  schedule:
    # Every 5 minutes, 24 hours a day, 7 days a week
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sharesanket-order-alerts
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-orders.txt

      - name: Install order-alert dependencies
        run: pip install -r requirements-orders.txt

      - name: Check NSE and BSE order announcements
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python order_scanner.py

      - name: Save state and Share Sanket alerts
        id: save
        if: always()
        run: |
          git add alerts.json seen.json order_state.json

          if ! git diff --cached --quiet; then
            if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || ! git diff --cached --quiet -- alerts.json; then
              echo "site_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "site_changed=false" >> "$GITHUB_OUTPUT"
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git commit -m "Update Share Sanket order alerts"

            git pull --rebase -q origin main
            git push origin HEAD:main

          else
            if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "site_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "site_changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Configure GitHub Pages
        if: steps.save.outputs.site_changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Share Sanket site
        if: steps.save.outputs.site_changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish Share Sanket site
        if: steps.save.outputs.site_changed == 'true'
        uses: actions/deploy-pages@v4

      - name: Telegram status
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" != "success" ]; then
            MSG="❌ Order Alerts scan FAILED - check GitHub Actions logs"
          else
            MSG="✅ Order Alerts scan completed"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MSG}" > /dev/null
