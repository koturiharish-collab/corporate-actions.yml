name: Share Sanket - Results Scanner

on:
  push:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sharesanket-data
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Results Module
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Results dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pypdf

      - name: Run Results Scanner
        run: |
          python results/results_scanner.py

      - name: Publish Results JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/alerts.json results/history.json results/calendar.json

          if ! git diff --cached --quiet; then
            git commit -m "Publish updated Share Sanket Results data"
            git pull --rebase -q origin main
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Share Sanket site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish Share Sanket site
        uses: actions/deploy-pages@v4
