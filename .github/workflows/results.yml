
name: Share Sanket - Results Scanner

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: share-sanket-results
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Results Module
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Results dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pypdf

      - name: Validate Results JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = {
              "alerts.json": "alerts",
              "history.json": "results",
              "calendar.json": "calendar",
          }

          for filename, key in files.items():
              path = Path("results") / filename
              with path.open(encoding="utf-8") as f:
                  data = json.load(f)

              if not isinstance(data.get(key), list):
                  raise SystemExit(f"Invalid structure: {path}")

              print(f"PASS: {path}")
          PY

      - name: Validate Python syntax
        run: |
          python -m py_compile results/results_scanner.py
          python -m py_compile results/source_adapter.py
          python -m py_compile results/pdf_extractor.py
          python -m py_compile results/financial_extractor.py
          echo "All Results Python files are valid."

      - name: Run Results Source Adapter
        run: |
          python results/source_adapter.py

      - name: Test SFC Results PDF extraction
        run: |
          python results/pdf_extractor.py SFC_TEST "https://nsearchives.nseindia.in/corporate/COMPLIANCE_SFC_23112026234018_sfcoutcom.pdf"

      - name: Run Financial Statement Extractor
        run: |
          python results/financial_extractor.py SFC_TEST

      - name: Upload extracted PDF text
        uses: actions/upload-artifact@v4
        with:
          name: sfc-results-pdf-text
          path: results/extracted/
          if-no-files-found: error

      - name: Upload Financial Review
        uses: actions/upload-artifact@v4
        with:
          name: sfc-financial-review
          path: results/review/SFC_TEST_financial_review.json
          if-no-files-found: error

      - name: Validate generated announcements
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("results/source_announcements.json")

          if not path.exists():
              raise SystemExit("Source announcements file missing")

          with path.open(encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data.get("announcements"), list):
              raise SystemExit("Invalid announcements structure")

          print("PASS: Source adapter output")
          print("Records:", len(data["announcements"]))
          PY

      - name: Run Results Scanner
        run: |
          python results/results_scanner.py

      - name: Publish Results JSON files to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/alerts.json
          git add results/history.json
          git add results/calendar.json

          if git diff --cached --quiet; then
            echo "No Results JSON changes to publish."
          else
            git commit -m "Publish updated Share Sanket Results data"
            git push
            echo "Results JSON files published to repository."
          fi

      - name: Upload Results data
        uses: actions/upload-artifact@v4
        with:
          name: share-sanket-results-data
          path: |
            results/alerts.json
            results/history.json
            results/calendar.json
          if-no-files-found: error

      - name: Report validation
        run: |
          echo "Results module validation completed."
          echo "Results Source Adapter completed."
          echo "PDF text extraction completed."
          echo "Financial review generated."
          echo "Results Scanner executed."
          echo "Results JSON files committed when changed."
          echo "GitHub Pages can serve the published JSON files."
          echo "Financial figures must be verified before publication."
