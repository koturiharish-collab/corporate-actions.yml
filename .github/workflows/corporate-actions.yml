name: Corporate Actions Alert (Splits, Bonus, Buyback)

on:
  schedule:
    # 3 runs per weekday (cron is UTC). Odd minutes avoid busy GitHub slots.
    - cron: "47 4 * * 1-5"    # 10:17 IST
    - cron: "47 8 * * 1-5"    # 14:17 IST
    - cron: "47 12 * * 1-5"   # 18:17 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corporate-actions
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan corporate actions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python corporate_actions.py

      - name: Save state
        if: always()
        run: |
          git add seen.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Update corporate action alert state"
            git pull --rebase -q || true
            git push
          fi

      # Sends a Telegram message only when the run fails (avoids 3 messages a day).
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="❌ Corporate Actions scan FAILED - check GitHub Actions logs" > /dev/null
