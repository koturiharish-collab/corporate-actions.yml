
name: Corporate Actions Alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sharesanket-corporate-actions
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install corporate-action dependencies
        run: pip install -r requirements.txt

      - name: Scan corporate actions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python corporate_actions.py

      - name: Save state and Share Sanket alerts
        id: save
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add alerts.json seen.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Share Sanket corporate actions"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "site_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GitHub Pages
        if: steps.save.outputs.site_changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Share Sanket site
        if: steps.save.outputs.site_changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish Share Sanket site
        if: steps.save.outputs.site_changed == 'true'
        uses: actions/deploy-pages@v4
