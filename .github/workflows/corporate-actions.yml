name: Order announcements scan

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours, UTC time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install requests

      - name: Check NSE and BSE order announcements
        env:
          RESULTS_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RESULTS_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python order_scanner.py

      - name: Save complete alerts and deduplication state
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add alerts.json order_state.json

          if git diff --cached --quiet; then
            echo "site_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
            git commit -m "Update NSE and BSE order alerts"
            git pull --rebase origin main
            git push origin HEAD:main
          fi