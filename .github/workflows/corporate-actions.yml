name: Fresh Bonus & Stock Split Alerts

on:
  schedule:
    # ==================================================
    # NSE MARKET HOURS
    #
    # GitHub Actions uses UTC.
    #
    # 09:47 IST = 04:17 UTC
    # 10:47 IST = 05:17 UTC
    # 11:47 IST = 06:17 UTC
    # 12:47 IST = 07:17 UTC
    # 13:47 IST = 08:17 UTC
    # 14:47 IST = 09:17 UTC
    # 15:17 IST = 09:47 UTC
    # ==================================================

    - cron: "17 4-9 * * 1-5"
    - cron: "47 9 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Fresh Corporate Actions Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python corporate_actions.py

      - name: Ensure seen state exists
        run: |
          if [ ! -f seen.json ]; then
            echo '{"initialized": false, "keys": []}' > seen.json
          fi

      - name: Save alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen.json

          if git diff --cached --quiet; then
            echo "No new state changes."
          else
            git commit -m "Update corporate action alert state"
            git push
          fi
