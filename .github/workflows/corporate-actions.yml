name: Fresh Bonus & Stock Split Alerts

on:
  schedule:
    # Every hour at minute 17 UTC
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # SETUP PYTHON
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # INSTALL DEPENDENCIES
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # RUN CORPORATE ACTIONS SCANNER
      # --------------------------------------------------
      - name: Run Fresh Corporate Actions Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python corporate_actions.py

      # --------------------------------------------------
      # MAKE SURE STATE FILE EXISTS
      # --------------------------------------------------
      - name: Ensure seen state exists
        run: |
          if [ ! -f seen.json ]; then
            echo '{"initialized": false, "keys": []}' > seen.json
          fi

      # --------------------------------------------------
      # SAVE FRESH-ALERT STATE
      # --------------------------------------------------
      - name: Save alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen.json

          if git diff --cached --quiet; then
            echo "No new corporate action state to save."
          else
            git commit -m "Update corporate action alert state"
            git push
          fi
