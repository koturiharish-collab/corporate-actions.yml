name: Corporate Actions Alert (Splits, Bonus, Buyback)

on:
  schedule:
    # Every 30 min, Mon-Fri, 08:42-20:12 IST (announcements come through the evening). Cron is UTC.
    - cron: "12,42 3-14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corporate-actions
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan corporate actions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python corporate_actions.py

      - name: Save state
        if: always()
        run: |
          git add seen.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Update corporate action alert state"
            git pull --rebase -q || true
            git push
          fi

      # ❌ on any failure. ✅ only from the last scheduled run of the day (20:00 IST or later).
      - name: Telegram status
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          HOUR=$(TZ=Asia/Kolkata date +%H)
          if [ "$JOB_STATUS" != "success" ]; then
            MSG="❌ Corporate Actions scan FAILED - check GitHub Actions logs"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$HOUR" -ge 20 ]; then
            MSG="✅ Corporate Actions: last scan of the day done ($(TZ=Asia/Kolkata date '+%d %b %H:%M IST'))"
          else
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MSG}" > /dev/null
