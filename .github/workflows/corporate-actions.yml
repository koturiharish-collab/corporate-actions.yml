name: Corporate Actions Alert (Splits, Bonus, Buyback)

on:
  push:
  schedule:
    # Every 5 minutes, Mon-Fri, 08:30-21:25 IST (cron is UTC).
    - cron: "*/5 3-15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sharesanket-data
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install corporate-action dependencies
        run: pip install -r requirements.txt

      - name: Scan corporate actions
        if: github.event_name != 'schedule' || github.event.schedule == '*/5 3-15 * * 1-5'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python corporate_actions.py

      - name: Save state and Share Sanket alerts
        id: save
        if: always()
        run: |
          git add alerts.json seen.json order_state.json

          if ! git diff --cached --quiet; then
            if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || ! git diff --cached --quiet -- alerts.json; then
              echo "site_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "site_changed=false" >> "$GITHUB_OUTPUT"
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git commit -m "Update Share Sanket corporate actions"

            git pull --rebase -q origin main
            git push origin HEAD:main

          else
            if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "site_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "site_changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Configure GitHub Pages
        if: steps.save.outputs.site_changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Share Sanket site
        if: steps.save.outputs.site_changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish Share Sanket site
        if: steps.save.outputs.site_changed == 'true'
        uses: actions/deploy-pages@v4

      - name: Telegram status
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          HOUR=$(TZ=Asia/Kolkata date +%H)

          if [ "$JOB_STATUS" != "success" ]; then
            MSG="❌ Corporate Actions scan FAILED - check GitHub Actions logs"
          elif [ "$EVENT_SCHEDULE" = "*/5 3-15 * * 1-5" ] && [ "$HOUR" -ge 20 ]; then
            MSG="✅ Corporate Actions: last scan of the day done ($(TZ=Asia/Kolkata date '+%d %b %H:%M IST'))"
          else
            exit 0
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MSG}" > /dev/null
